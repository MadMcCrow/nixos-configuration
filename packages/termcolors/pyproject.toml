[tool.poetry]
name = "termcolors"
version = "0.1.0"
description = "a simple python script to test your terminal colors"
authors = ["MadMcCrow <do-not-mail.me@please.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.scripts]
termcolors = 'termcolors:main'

[build-system]
requires = ["poetry-core>=1.9.1,<3.0"]
build-backend = "poetry.core.masonry.api"