[tool.poetry]
name = "nixos-pyinstall"
version = "0.1.0"
description = "python tool to install nixos configurations"
authors = ["MadMcCrow <do-not-mail.me@please.com>"]
packages = [
    
        { include = "steps", from = "src", to = "pyinstall" },
        { include = "*",     from = "src", to = "pyinstall" },
    ]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
nixos-pyconfig = "^0.1"

[tool.poetry.scripts]
nixos-pyinstall = 'pyinstall.__main__:main'

[build-system]
requires = ["poetry-core>=1.9.1,<3.0"]
build-backend = "poetry.core.masonry.api"