[tool.poetry]
name = "nixos-pyconfig"
version = "0.1.0"
description = "python tool to parse nixos configurations"
authors = ["MadMcCrow <do-not-mail.me@please.com>"]
packages = [
        { include = "pyconfig" },
        { include = "nix",  from = "pyconfig" },
        { include = "extra", from = "pyconfig" },
    ]
license = "MIT"
readme = "README.md"
keywords = [ "nixOS", "nix" ]

[tool.poetry.dependencies]
python = "^3.11"
pycall = "^0.1"

[tool.poetry.scripts]
nixos-pyconfig = 'pyconfig.__main__:main'

[build-system]
requires = ["poetry-core>=1.9.1,<3.0"]
build-backend = "poetry.core.masonry.api"