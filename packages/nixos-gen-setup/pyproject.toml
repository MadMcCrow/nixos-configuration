[tool.poetry]
name = "nixos-gen-setup"
version = "0.1.0"
description = "tool to generate a sh script to install a nixos-configuration"
authors = ["MadMcCrow <do-not-mail.me@please.com>"]
packages = [
        {include = "cli",     from = "src"},
        {include = "private", from = "src"}
    ]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.scripts]
nixos-gen-setup = 'cli:main'

[build-system]
requires = ["poetry-core>=1.9.1,<3.0"]
build-backend = "poetry.core.masonry.api"