# default_host.toml
# This file contains an example host configuration for testing.
# this would be located at /etc/nixos/config.toml

hostname = "test-host"
# timezone = "Europe/Paris" # already the default
# system  = "x86_64-linux"  # not necessary !

[users.alice]
fullname   = "Alice Wonderland"
shell  = "zsh"
groups = ["wheel", "networkmanager"]
hashedPassword = "$6$dummyhash$."

[hardware]
cpu = "amd"
gpu = "amd"

# if you remove this you should get an error
[hardware.storage]
main = "/dev/nvme0n1"

# this should trigger a warning
[unknownkey]
notakey = "wrong"
