# default_host.toml
# This file contains an example host configuration for testing.
# this would be located at /etc/nixos/config.toml

# not needed : we default to Self
# flake   = "github:MadMcCrow/NonOS"
system  = "x86_64-linux"

hostname = "test-host"
timezone = "Europe/Paris"

[security.onlykey]
enable = true

[users.alice]
fullname   = "Alice Wonderland"
shell  = "zsh"
groups = ["wheel", "networkmanager"]
hashedPassword = "$6$dummyhash$."

[hardware]
cpu = "amd"
gpu = "amd"

[hardware.storage]
main = "/dev/nvme0n1"
